function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function ts(s) { return new Date(s + 'T12:00:00').getTime(); }
function money(n) { return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function mdy(s) { var p = s.split('-'); return p[1] + '/' + p[2] + '/' + p[0]; }
function short(s) { return new Date(ts(s)).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function sum(lines) { return lines.reduce(function (a, l) { return a + l.amount; }, 0); }
function uniq(arr) { return arr.filter(function (v, i) { return arr.indexOf(v) === i; }); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function linesOf(keys) { return LINES.filter(function (l) { return keys.indexOf(l.pay) !== -1; }); }
function paymentsFor(school) { return PAYMENTS.filter(function (p) { return PAYEES[p.payee].school === school; }).sort(function (a, b) { return ts(b.date) - ts(a.date); }); }

function filterHtml(cfg, lines, alignRight) {

  return h + '</div>';

    var expanded = !isLeaf && !!state.open[key];

    var funds = uniq(sub.map(function (l) { return l.fund; }));
    var isRefund = isLeaf && sub.every(function (l) { return l.refund; });

    h += '<span style="display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' + (isRefund ? ';color:#B4000D' : '') + '" title="' + esc(v) + '">' + esc(v) + '</span>';

    h += '<div role="cell" style="padding:8px 16px;text-align:right;white-space:nowrap;font-weight:600;color:' + (amt < 0 ? '#B4000D' : '#005CB9') + '">' + money(amt) + '</div></div>';
    if (expanded) { h += rowsHtml(sub, li + 1, key); }
  });
  return h;
}

function parentKeys(lines, li, path, out) {
  if (li >= LEVELS.length - 1) { return out; }
  var lv = LEVELS[li];
  uniq(lines.map(function (l) { return l[lv.key]; })).forEach(function (v) {
    out[path + '/' + v] = true;
    parentKeys(lines.filter(function (l) { return l[lv.key] === v; }), li + 1, path + '/' + v, out);
  });
  return out;
}

  var cutoff = ts(TODAY) - s.range * DAY;

  var h = '<div class="sample">Prototype with sample data. ' + L.type + ' Payout Reports.</div>';

  if (s.sheetOpen) {

document.addEventListener('input', function (e) {

});

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-h]');

});
document.addEventListener('change', function (e) {
  var el = e.target.closest('[data-c]');
  if (el) { handlers[+el.getAttribute('data-c')](); }
});
render();
